<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" width="100%" height="220" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Dynamic Multi-stop Brand Gradient -->
    <linearGradient id="zlineBrandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb">
        <animate attributeName="stop-color" 
          values="#2563eb; #7c3aed; #e73700; #f97316; #2563eb" 
          dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="35%" stop-color="#7c3aed">
        <animate attributeName="stop-color" 
          values="#7c3aed; #e73700; #f97316; #2563eb; #7c3aed" 
          dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="70%" stop-color="#e73700">
        <animate attributeName="stop-color" 
          values="#e73700; #f97316; #2563eb; #7c3aed; #e73700" 
          dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#f97316">
        <animate attributeName="stop-color" 
          values="#f97316; #2563eb; #7c3aed; #e73700; #f97316" 
          dur="5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Z-specific adaptive gradient -->
    <linearGradient id="zLetterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb">
        <animate attributeName="stop-color" 
          values="#2563eb; #06b6d4; #3b82f6; #7c3aed; #2563eb" 
          dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#7c3aed">
        <animate attributeName="stop-color" 
          values="#7c3aed; #2563eb; #06b6d4; #3b82f6; #7c3aed" 
          dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Shimmer reflection effect -->
    <linearGradient id="shimmerSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0" />
      <stop offset="50%" stop-color="white" stop-opacity="0.55" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
      <animate attributeName="x1" from="-120%" to="200%" dur="3s" repeatCount="indefinite" />
      <animate attributeName="x2" from="-20%" to="300%" dur="3s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Soft radial glow -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .tagline {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 600;
        letter-spacing: 3.5px;
        text-transform: uppercase;
        font-size: 13.5px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 1.5px;
      }
      @media (prefers-color-scheme: light) {
        .tagline { fill: #4b5563; }
        .decor-line { stroke: rgba(0, 0, 0, 0.12); }
        .z-fallback { fill: #241f1f; }
        .badge-bg { fill: rgba(37, 99, 235, 0.08); stroke: rgba(37, 99, 235, 0.25); }
        .badge-text { fill: #1d4ed8; }
      }
      @media (prefers-color-scheme: dark) {
        .tagline { fill: #d1d5db; }
        .decor-line { stroke: rgba(255, 255, 255, 0.16); }
        .z-fallback { fill: #ffffff; }
        .badge-bg { fill: rgba(37, 99, 235, 0.2); stroke: rgba(37, 99, 235, 0.4); }
        .badge-text { fill: #93c5fd; }
      }
    </style>
  </defs>

  <!-- Ambient Glow Behind Logo -->
  <ellipse cx="410" cy="90" rx="260" ry="50" fill="url(#zlineBrandGrad)" opacity="0.18" filter="url(#softGlow)">
    <animate attributeName="rx" values="240; 290; 240" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.14; 0.26; 0.14" dur="4s" repeatCount="indefinite" />
  </ellipse>

  <!-- Decorative Accent Beams -->
  <g>
    <line x1="60" y1="92" x2="200" y2="92" class="decor-line" stroke-width="2" stroke-linecap="round">
      <animate attributeName="x2" values="170; 210; 170" dur="3s" repeatCount="indefinite" />
    </line>
    <circle cx="210" cy="92" r="3.5" fill="#2563eb">
      <animate attributeName="cx" values="180; 220; 180" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4; 1; 0.4" dur="3s" repeatCount="indefinite" />
    </circle>

    <line x1="620" y1="92" x2="760" y2="92" class="decor-line" stroke-width="2" stroke-linecap="round">
      <animate attributeName="x1" values="650; 610; 650" dur="3s" repeatCount="indefinite" />
    </line>
    <circle cx="610" cy="92" r="3.5" fill="#e73700">
      <animate attributeName="cx" values="640; 600; 640" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4; 1; 0.4" dur="3s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Ambient Floating Tech Sparks -->
  <g>
    <circle cx="280" cy="45" r="2.5" fill="#3b82f6">
      <animate attributeName="opacity" values="0.2; 1; 0.2" dur="2s" repeatCount="indefinite" />
      <animate attributeName="cy" values="47; 42; 47" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="530" cy="40" r="2.5" fill="#f97316">
      <animate attributeName="opacity" values="0.3; 1; 0.3" dur="2.7s" repeatCount="indefinite" />
      <animate attributeName="cy" values="42; 37; 42" dur="2.7s" repeatCount="indefinite" />
    </circle>
    <circle cx="560" cy="130" r="2" fill="#7c3aed">
      <animate attributeName="opacity" values="0.2; 0.9; 0.2" dur="3.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Official Zline Brand Wordmark with Live Transformations -->
  <g transform="translate(410, 88)">
    <g transform="matrix(1.58 0 0 1.58 0 0) translate(-512, -384)" id="zlineWordmark">
      <g transform="matrix(3.2622 0 0 3.2622 512 384)">
        <g>
          <!-- 'Z' Glyph with Shimmer Gradient -->
          <g transform="matrix(1 0 0 1 -59.0759 0.8288)">
            <g transform="matrix(1 0 0 1 0 0)">
              <!-- Outer Shadow / Soft Blur -->
              <path 
                fill="url(#zLetterGrad)" 
                opacity="0.35" 
                filter="url(#softGlow)"
                transform="translate(-100, -100)" 
                d="M 79.2622 119.8227 L 104.313 82.6465 L 79.9106 82.6465 L 87.8315 71.9175 L 119.73 71.9175 L 119.73 80.1836 L 94.4409 117.353 L 120.7378 117.353 L 112.8169 128.0825 L 79.2622 128.0825 L 79.2622 119.8227 Z"
              />
              <!-- Sharp Core Path -->
              <path 
                fill="url(#zLetterGrad)" 
                transform="translate(-100, -100)" 
                d="M 79.2622 119.8227 L 104.313 82.6465 L 79.9106 82.6465 L 87.8315 71.9175 L 119.73 71.9175 L 119.73 80.1836 L 94.4409 117.353 L 120.7378 117.353 L 112.8169 128.0825 L 79.2622 128.0825 L 79.2622 119.8227 Z"
              />
              <!-- Light Sweep Shimmer Overlay -->
              <path 
                fill="url(#shimmerSweep)" 
                transform="translate(-100, -100)" 
                d="M 79.2622 119.8227 L 104.313 82.6465 L 79.9106 82.6465 L 87.8315 71.9175 L 119.73 71.9175 L 119.73 80.1836 L 94.4409 117.353 L 120.7378 117.353 L 112.8169 128.0825 L 79.2622 128.0825 L 79.2622 119.8227 Z"
              />
            </g>
          </g>

          <!-- 'l' Glyph with Fluid Color Motion -->
          <g transform="matrix(1 0 0 1 -28.4413 -0.1072)">
            <g transform="matrix(1 0 0 1 0 0)">
              <path 
                fill="url(#zlineBrandGrad)" 
                transform="translate(-100.0011, -95.8215)" 
                d="M 105.4375 66.803 L 105.4375 124.84 L 94.5647 124.84 L 94.5647 70.4033 L 105.4375 66.803 Z"
              />
              <path 
                fill="url(#shimmerSweep)" 
                transform="translate(-100.0011, -95.8215)" 
                d="M 105.4375 66.803 L 105.4375 124.84 L 94.5647 124.84 L 94.5647 70.4033 L 105.4375 66.803 Z"
              />
            </g>
          </g>

          <!-- 'i' Glyph -->
          <g transform="matrix(1 0 0 1 -10.8012 8.1361)">
            <g transform="matrix(1 0 0 1 0 0)">
              <path 
                fill="url(#zlineBrandGrad)" 
                transform="translate(-100.001, -104.0662)" 
                d="M 105.4375 83.2924 L 105.4375 124.84 L 94.5645 124.84 L 94.5645 86.8928 L 105.4375 83.2924 Z"
              />
              <path 
                fill="url(#shimmerSweep)" 
                transform="translate(-100.001, -104.0662)" 
                d="M 105.4375 83.2924 L 105.4375 124.84 L 94.5645 124.84 L 94.5645 86.8928 L 105.4375 83.2924 Z"
              />
            </g>
          </g>

          <!-- 'n' Glyph -->
          <g transform="matrix(1 0 0 1 19.1158 8.64)">
            <g transform="matrix(1 0 0 1 0 0)">
              <path 
                fill="url(#zlineBrandGrad)" 
                transform="translate(-100.3623, -104.5703)" 
                d="M 118.5078 103.5262 L 118.5078 124.8401 L 107.707 124.8401 L 107.707 103.5262 C 107.707 99.4939 104.3948 96.1815 100.3623 96.1815 C 96.69 96.1815 93.5938 98.9178 93.0899 102.5181 L 93.0899 124.8401 L 82.2888 124.8401 L 82.2888 103.5262 L 82.2168 103.5262 C 82.2168 103.0222 82.2168 102.4461 82.2888 101.942 L 82.2888 84.3005 L 93.0899 84.3005 L 93.0899 86.8928 C 95.322 85.8847 97.8423 85.3806 100.3623 85.3806 C 105.1868 85.3806 109.7952 87.2528 113.1795 90.7091 C 116.6358 94.1654 118.5078 98.7017 118.5078 103.5262 Z"
              />
              <path 
                fill="url(#shimmerSweep)" 
                transform="translate(-100.3623, -104.5703)" 
                d="M 118.5078 103.5262 L 118.5078 124.8401 L 107.707 124.8401 L 107.707 103.5262 C 107.707 99.4939 104.3948 96.1815 100.3623 96.1815 C 96.69 96.1815 93.5938 98.9178 93.0899 102.5181 L 93.0899 124.8401 L 82.2888 124.8401 L 82.2888 103.5262 L 82.2168 103.5262 C 82.2168 103.0222 82.2168 102.4461 82.2888 101.942 L 82.2888 84.3005 L 93.0899 84.3005 L 93.0899 86.8928 C 95.322 85.8847 97.8423 85.3806 100.3623 85.3806 C 105.1868 85.3806 109.7952 87.2528 113.1795 90.7091 C 116.6358 94.1654 118.5078 98.7017 118.5078 103.5262 Z"
              />
            </g>
          </g>

          <!-- 'e' Glyph -->
          <g transform="matrix(1 0 0 1 59.508 8.856)">
            <g transform="matrix(1 0 0 1 0 0)">
              <path 
                fill="url(#zlineBrandGrad)" 
                transform="translate(-100.1462, -104.7863)" 
                d="M 85.8169 119.1516 C 82.0006 115.3352 79.8405 110.2227 79.8405 104.8223 C 79.8405 99.3498 82.0006 94.3094 85.8169 90.421 C 89.6333 86.6047 94.7457 84.5166 100.1463 84.5166 C 105.5466 84.5166 110.6591 86.6047 114.4754 90.421 C 118.3638 94.3094 120.4519 99.3498 120.4519 104.8223 L 120.4519 110.0067 L 91.7935 110.0067 C 93.5936 112.815 96.6179 114.6151 100.1462 114.6151 C 102.8825 114.6151 105.4746 113.5351 107.3468 111.5189 L 114.9075 118.7195 C 113.0353 120.7357 110.8031 122.2478 108.3549 123.3999 C 105.7627 124.48 103.0264 125.0561 100.1462 125.0561 C 94.7457 125.056 89.6333 122.9679 85.8169 119.1516 Z M 108.4989 99.5659 C 106.7708 96.8296 103.6746 94.9575 100.1463 94.9575 C 96.6179 94.9575 93.5936 96.8296 91.7935 99.5659 L 108.4989 99.5659 Z"
              />
              <path 
                fill="url(#shimmerSweep)" 
                transform="translate(-100.1462, -104.7863)" 
                d="M 85.8169 119.1516 C 82.0006 115.3352 79.8405 110.2227 79.8405 104.8223 C 79.8405 99.3498 82.0006 94.3094 85.8169 90.421 C 89.6333 86.6047 94.7457 84.5166 100.1463 84.5166 C 105.5466 84.5166 110.6591 86.6047 114.4754 90.421 C 118.3638 94.3094 120.4519 99.3498 120.4519 104.8223 L 120.4519 110.0067 L 91.7935 110.0067 C 93.5936 112.815 96.6179 114.6151 100.1462 114.6151 C 102.8825 114.6151 105.4746 113.5351 107.3468 111.5189 L 114.9075 118.7195 C 113.0353 120.7357 110.8031 122.2478 108.3549 123.3999 C 105.7627 124.48 103.0264 125.0561 100.1462 125.0561 C 94.7457 125.056 89.6333 122.9679 85.8169 119.1516 Z M 108.4989 99.5659 C 106.7708 96.8296 103.6746 94.9575 100.1463 94.9575 C 96.6179 94.9575 93.5936 96.8296 91.7935 99.5659 L 108.4989 99.5659 Z"
              />
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- Animated Tagline with Soft Opacity Wave -->
  <g transform="translate(410, 185)" text-anchor="middle">
    <text x="0" y="0" class="tagline">
      Private by Design • Secure by Default • AI-Supercharged
      <animate attributeName="opacity" values="0.75; 1; 0.75" dur="3s" repeatCount="indefinite" />
    </text>
  </g>
</svg>
